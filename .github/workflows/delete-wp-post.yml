name: Delete One WordPress Post (DESTRUCTIVE -- trashes by default)

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress post ID to delete"
        required: true
      confirm_post_id:
        description: "Re-type the SAME post ID to confirm (fat-finger guard)"
        required: true
      force:
        description: "Bypass trash and delete permanently (irreversible)"
        required: false
        default: "false"
      redirect_to:
        description: "If the post is published: exact URL to 301-redirect its old address to. Leave blank to fall back to the post's own primary category page. Ignored for drafts (never had a public URL)."
        required: false
        default: ""

# DESTRUCTIVE: moves the given post to trash (recoverable) unless force=true.
# Requires post_id and confirm_post_id to match exactly, or the run aborts
# before making any request. If the post is currently published, a 301
# redirect is created first (explicit redirect_to, else the post's primary
# category) -- the delete is aborted if that redirect can't be created.
jobs:
  delete-post:
    name: "Delete post"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete post via WP REST API
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          CONFIRM_POST_ID: ${{ github.event.inputs.confirm_post_id }}
          FORCE: ${{ github.event.inputs.force }}
          REDIRECT_TO: ${{ github.event.inputs.redirect_to }}
        run: python3 scripts/delete_wp_post.py
