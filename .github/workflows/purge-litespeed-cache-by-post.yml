name: Purge LiteSpeed Cache for One Post/Page (targeted, not site-wide)

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post/page ID to purge LiteSpeed cache for (targeted only)"
        required: true
      confirm:
        description: "Type 'yes' to actually run (safety gate)"
        required: true
        default: "no"

# WRITE ACTION: creates a temporary Code Snippet scoped to purging exactly
# one post ID via LiteSpeed's own do_action('litespeed_purge_post', $id),
# calls it once, deletes the temp snippet. Never a site-wide purge.
jobs:
  purge-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Purge cache for one post
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          POST_ID: ${{ github.event.inputs.post_id }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: python3 scripts/purge_litespeed_cache_by_post.py
