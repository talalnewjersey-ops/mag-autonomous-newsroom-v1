name: Search WordPress Content For String (read-only diagnostic)

on:
  workflow_dispatch:
    inputs:
      search_string:
        description: "Literal substring to search for in post content (e.g. a slug to check for internal links before renaming it)"
        required: true
      statuses:
        description: "Comma-separated post statuses to search"
        required: false
        default: "publish,draft"

# READ-ONLY: searches every listed post's raw content for a literal
# substring and prints matches. Never writes to WordPress.
jobs:
  search-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search content
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          SEARCH_STRING: ${{ github.event.inputs.search_string }}
          STATUSES: ${{ github.event.inputs.statuses }}
        run: python3 scripts/search_wp_content_for_string.py
